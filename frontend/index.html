<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cricket Game - JSON Test Client</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        #log { background: black; color: lime; padding: 10px; height: 300px; overflow-y: scroll; margin-top: 10px; font-family: monospace;}
        input, button { padding: 10px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>🏏 Cricket Game Server (JSON Test)</h1>
    
    <input type="text" id="messageBox" placeholder="Type a chat message...">
    <button onclick="sendMessage()">Server Ko Bhejo (Send)</button>

    <div id="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        function printLog(msg) {
            logDiv.innerHTML += `<div>${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight; // Auto-scroll
        }

        // 1. C++ Server se connect hone ki koshish (Port 9001)
        const socket = new WebSocket('ws://localhost:9001');

        socket.binaryType = "arraybuffer"; 

        // 2. Jab Server connect ho jaye
         socket.onopen = function(event) {
            printLog("🟢 Server se connection successful!");
            
            // JSON hata diya! Ab ArrayBuffer (Raw Bytes) banayenge
            // 1 Byte memory book ki
            const buffer = new ArrayBuffer(1); 
            const view = new DataView(buffer);
            
            // Uske 0th index par '1' likha (1 = PLAYER_JOIN)
            view.setUint8(0, 1); 
            
            socket.send(buffer);
            printLog("📤 Maine Binary Bheja: [Message Type 1]");
        };

        // 3. Jab Server se koi reply aaye
        socket.onmessage = function(event) {
            printLog("📩 Server se kuch aaya!");
        };

        // 4. Agar server band ho jaye
        socket.onclose = function(event) {
            printLog("🔴 Server disconnect ho gaya.");
        };

        // 5. Button click hone par server ko JSON message bhejna
        function sendMessage() {
            const input = document.getElementById('messageBox');
            if(socket.readyState === WebSocket.OPEN) {
                
                const buffer = new ArrayBuffer(9);
                const view  = new DataView(buffer);
                view.setUint8(0, 2); // 2 = CHAT_MESSAGE
                view.setFloat32(1,34.3,true);
                view.setFloat32(5,89.9,true);//power
                +
                socket.send(buffer);
                   printLog("📤 Maine Binary Shot Bheja: Angle 45.5, Power 80.0");

            } else {
                printLog("⚠️ Server abhi connected nahi hai.");
            }
        }
    </script>
</body>
</html>
